name: Production deploy to Render

# Production deploys only when someone runs this workflow by hand
# (Actions > Production deploy to Render > Run workflow). Nothing deploys it on a push.
on:
  workflow_dispatch:

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render and Update GitHub Environments
    runs-on: ubuntu-latest
    
    # Required permission to create a GitHub Deployment/Environment
    permissions:
      contents: read
      deployments: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to Render
        # This action triggers the Render deploy and reports status to GitHub Deployments
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clear_cache: false
          wait_deploy: false # Set to false to avoid 'Can't find the triggered deploy' Render API bug
          github_deployment: true # Creates the deployment in the GitHub UI
          deployment_environment: 'production' # Environment name in GitHub
