name: Terminal builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: whatsmynote-macos
          - os: windows-latest
            artifact: whatsmynote-windows.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build one-file executable
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name ${{ matrix.artifact }}
          --collect-all textual
          --hidden-import whatsmynote.app.main
          -m whatsmynote.app.main:main

      - name: Require the built artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${{ matrix.artifact }}"
          echo "Built dist/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Require both release assets
        run: |
          set -euo pipefail
          test -f dist/whatsmynote-macos/whatsmynote-macos
          test -f dist/whatsmynote-windows.exe/whatsmynote-windows.exe

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/whatsmynote-macos/whatsmynote-macos \
            dist/whatsmynote-windows.exe/whatsmynote-windows.exe \
            --clobber
